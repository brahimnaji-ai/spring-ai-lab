spring:
  application:
    name: spring-ai-lab
  config:
    import: optional:file:.env[.properties]

  ai:
    # GEMINI Config
    google:
      genai:
        api-key: ${GENAI_API_KEY}
        project-id: ${PROJECT_ID}
        chat:
          model: ${GENAI_CHAT_MODEL}
    # ANTHROPIC Config
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL}
        max-tokens: 1024
    # OLLAMA Config
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:7b
server:
  port: 8080

#logging:
#  level:
#    root: DEBUG
logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG

    com:
      brahim:
        springailab: DEBUG