spring:
  application:
    name: spring-ai-lab
  config:
    import: optional:file:.env[.properties]

  # DATASOURCE
  datasource:
    url: jdbc:postgresql://localhost:5432/spring_ai
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  # REDIS
  data:
    redis:
      host: localhost
      port: 6379


  # OPTION: EXCLUDE JDBC STARTER TO WORK WITH REDIS STARTER (PREVENT BEAN INJECTION CONFLICT)
#  autoconfigure:
#    exclude:
#      - org.springframework.ai.model.chat.memory.repository.jdbc.autoconfigure.JdbcChatMemoryRepositoryAutoConfiguration

  ai:
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: always
    stabilityai:
      api-key: ${STABILITY_API_KEY}
      image:
        n: 1 # Generate one image  1<n<=10.
        model: sd3.5-flash
    # GEMINI Config
    google:
      genai:
        api-key: ${GENAI_API_KEY}
        project-id: ${PROJECT_ID}
        chat:
          model: ${GENAI_CHAT_MODEL}

    # ANTHROPIC Config
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        model: ${ANTHROPIC_CHAT_MODEL}
        max-tokens: 1024
    # OLLAMA Config
    ollama:
      base-url: http://localhost:11434
      chat:
        model: qwen2.5-coder:7b

server:
  port: 8080





