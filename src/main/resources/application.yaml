spring:
  application:
    name: spring-ai-lab
  config:
    import: optional:file:.env[.properties]
  ai:
    model:
      chat: google-genai
    google:
      genai:
        api-key: ${GENAI_API_KEY}
        project-id: ${PROJECT_ID}
        chat:
          model: ${CHAT_MODEL}
server:
  port: 9090

